<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个性化旅游系统 - 目的地推荐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div id="app" class="max-w-7xl mx-auto p-6">
    <header class="mb-6">
        <h1 class="text-3xl font-bold text-gray-900">个性化旅游系统</h1>
        <p class="text-gray-600 mt-2">第一步：先推荐多个景区/学校，点击后新开标签页进入该目的地的场所推荐。</p>
    </header>

    <div class="bg-white rounded-lg shadow p-4 mb-6 grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
        <div>
            <label class="text-sm text-gray-600">目的地类型</label>
            <select v-model="form.destinationType" class="border rounded px-3 py-2 w-full">
                <option value="all">全部</option>
                <option value="scenic">景区</option>
                <option value="school">学校</option>
            </select>
        </div>
        <div>
            <label class="text-sm text-gray-600">排序</label>
            <select v-model="form.sortBy" class="border rounded px-3 py-2 w-full">
                <option value="heat">按热度</option>
                <option value="score">按评分</option>
            </select>
        </div>
        <div>
            <label class="text-sm text-gray-600">展示数量</label>
            <input v-model.number="form.limit" type="number" min="1" max="30" class="border rounded px-3 py-2 w-full">
        </div>
        <button @click="fetchDestinations" class="bg-indigo-600 text-white rounded px-4 py-2">刷新推荐</button>
    </div>

    <div v-if="error" class="mb-6 p-3 border border-red-300 bg-red-50 text-red-700 rounded">{{ error }}</div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <div v-for="item in destinations" :key="item.id" class="bg-white border rounded-xl shadow-sm overflow-hidden">
            <img :src="item.image_url || defaultImage" class="h-44 w-full object-cover" alt="目的地图">
            <div class="p-4 space-y-2">
                <div class="flex items-center justify-between">
                    <h3 class="font-semibold text-gray-900 truncate">{{ item.name }}</h3>
                    <span class="text-xs px-2 py-1 rounded bg-indigo-100 text-indigo-700">{{ item.type === 'school' ? '学校' : (item.type === 'scenic' ? '景区' : '综合') }}</span>
                </div>
                <p class="text-sm text-gray-600">{{ item.category }} · 推荐值 {{ item.score }}</p>
                <button @click="openDestination(item)" class="w-full mt-2 bg-emerald-600 text-white rounded px-3 py-2 text-sm">进入该目的地（新标签页）</button>
            </div>
        </div>
    </div>
</div>

<script>
const { createApp, ref, reactive, onMounted } = Vue;

createApp({
    setup() {
        const API_BASE = "http://localhost:8000";
        const defaultImage = "https://images.unsplash.com/photo-1501504905252-473c47e087f8?auto=format&fit=crop&w=900&q=60";
        const destinations = ref([]);
        const error = ref("");
        const form = reactive({
            destinationType: "all",
            sortBy: "heat",
            limit: 12
        });

        const fetchDestinations = async () => {
            error.value = "";
            try {
                const res = await axios.get(`${API_BASE}/api/recommendation/suggest/destinations`, {
                    params: {
                        destination_type: form.destinationType,
                        sort_by: form.sortBy,
                        limit: form.limit
                    }
                });
                destinations.value = res.data?.recommendations || [];
            } catch (err) {
                error.value = err?.response?.data?.detail || err?.message || "加载推荐失败";
            }
        };

        const openDestination = (item) => {
            const url = `destination.html?poi_id=${encodeURIComponent(item.id)}&name=${encodeURIComponent(item.name)}`;
            window.open(url, "_blank");
        };

        onMounted(fetchDestinations);
        return { form, destinations, error, fetchDestinations, openDestination, defaultImage };
    }
}).mount("#app");
</script>
</body>
</html>
